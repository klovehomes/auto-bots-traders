[package]
name = "trader-vault"
version = "0.1.0"
description = "On-device trading-keys vault and bot runner"
edition = "2021"

[lib]
name = "trader_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS keystore: macOS/iOS Keychain, Windows Credential Manager, Linux Secret Service.
# (Android gets its own Keystore-backed implementation in the mobile phase.)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
argon2 = "0.5"
rand = "0.8"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
base64 = "0.22"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["time"] }
