# Project name (Keith, 2026-11-03): containers/volumes/network are
# prefixed "traders-" instead of the folder name ("app-").
name: traders

services:
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    environment:
      API_PORT: "8080"
      INTERNAL_EVENT_TOKEN: ${INTERNAL_EVENT_TOKEN:-dev-token}
      MODE: ${MODE:-sim}
      # Production public dashboard origin (UI_URL in .env). When set,
      # the API's CORS allowlist is exactly this origin; unset = local
      # development behaviour (reflect any origin).
      UI_URL: ${UI_URL:-}
      BOTS_DIR: /bots
      # Risk Gate control state (kill switch halts + audit log) lives on
      # a named volume so a halt survives container restarts/rebuilds.
      CONTROL_STATE_PATH: /data/control-state.json
      # Phase 5 (dashboard mode switch): the API owns the stored
      # desired mode on the same shared volume. The engine reads this
      # file at boot (stored beats the MODE env initial default) and
      # learns runtime changes through the internal control poll.
      MODE_STATE_PATH: /data/mode-state.json
      # Phase 6 (event history): the API persists the event stream —
      # decisions above all — on the same shared volume, so the
      # dashboard's Decisions tab shows the full day even when no tab
      # was open while the bots were deciding.
      EVENT_HISTORY_PATH: /data/event-history.json
      # Phase PM3 (split-screen allocations): the shared-pool ledger —
      # Bot Trades allocation, sleeve toggles, booked user selections —
      # on the same shared volume, following the control-state pattern.
      ALLOCATIONS_STATE_PATH: /data/allocations.json
      # Phase PM6 (sleeve availability): PRESENCE ONLY. The API never
      # calls Alpaca or Kalshi — it checks whether these are non-empty
      # so GET /allocations can grey out Bot Trades sleeves that can't
      # really trade in the current run mode, with the reason. The
      # values themselves stay in .env and are never served or logged.
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET:-}
      KALSHI_API_KEY_ID: ${KALSHI_API_KEY_ID:-}
      KALSHI_PRIVATE_KEY: ${KALSHI_PRIVATE_KEY:-}
      # Phase PM7 (email gate): OFF unless GATE_ENABLED=true in .env.
      # The gate DB lives on the same fleet-data volume as the other
      # state files. RESEND_API_KEY/MAIL_FROM are read by the API to
      # email activation codes (values never served or logged); with
      # no key the gate runs in dev mode and returns codes in the
      # register response. GATE_COOKIE_SECURE stays false while the
      # dashboard is plain http (Tailscale) — see .env.example.
      GATE_ENABLED: ${GATE_ENABLED:-false}
      GATE_SESSION_SECRET: ${GATE_SESSION_SECRET:-}
      GATE_STATE_PATH: /data/gate-state.json
      GATE_COOKIE_SECURE: ${GATE_COOKIE_SECURE:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      # Bot definitions live outside the app image; mounted read-only.
      - ../bots:/bots:ro
      - fleet-data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped

  engine:
    build:
      context: .
      dockerfile: packages/engine/Dockerfile
    environment:
      API_BASE_URL: http://api:8080
      INTERNAL_EVENT_TOKEN: ${INTERNAL_EVENT_TOKEN:-dev-token}
      MODE: ${MODE:-sim}
      BOTS_DIR: /bots
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET:-}
      ALPACA_PAPER: ${ALPACA_PAPER:-true}
      # Phase 5: the stored dashboard mode choice (written by the API,
      # see MODE_STATE_PATH on the api service). Read at boot; when the
      # dashboard flips the switch, this engine exits and the restart
      # policy below relaunches it into the stored mode.
      MODE_STATE_PATH: /data/mode-state.json
    volumes:
      - ../bots:/bots:ro
      - fleet-data:/data
    depends_on:
      - api
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        # Production public API address (API_URL in .env). Vite bakes
        # it into the static bundle at build time, so changing API_URL
        # requires `docker compose up -d --build`, not a restart.
        VITE_API_URL: ${API_URL:-}
    ports:
      - "4173:4173"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  # API-owned persistent state (kill-switch control state today).
  fleet-data:
