# Project name (Keith, 2026-11-03): containers/volumes/network are
# prefixed "traders-" instead of the folder name ("app-").
name: traders

services:
  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    environment:
      API_PORT: "8080"
      INTERNAL_EVENT_TOKEN: ${INTERNAL_EVENT_TOKEN:-dev-token}
      MODE: ${MODE:-sim}
      # Production public dashboard origin (UI_URL in .env). When set,
      # the API's CORS allowlist is exactly this origin; unset = local
      # development behaviour (reflect any origin).
      UI_URL: ${UI_URL:-}
      BOTS_DIR: /bots
      # Risk Gate control state (kill switch halts + audit log) lives on
      # a named volume so a halt survives container restarts/rebuilds.
      CONTROL_STATE_PATH: /data/control-state.json
      # Phase 5 (dashboard mode switch): the API owns the stored
      # desired mode on the same shared volume. The engine reads this
      # file at boot (stored beats the MODE env initial default) and
      # learns runtime changes through the internal control poll.
      MODE_STATE_PATH: /data/mode-state.json
      # Phase 6 (event history): the API persists the event stream —
      # decisions above all — on the same shared volume, so the
      # dashboard's Decisions tab shows the full day even when no tab
      # was open while the bots were deciding.
      EVENT_HISTORY_PATH: /data/event-history.json
      # Phase 12 (v21): the API reads the same keys file as the engine
      # so GET /keys/status can report presence. The file itself is
      # mounted below (read-only); the default source is /dev/null —
      # an empty mount — until TRADERBOT_KEYS_FILE is set in .env.
      KEYS_FILE: /keys/traderbot-keys.txt
    volumes:
      # Bot definitions live outside the app image; mounted read-only.
      - ../bots:/bots:ro
      - fleet-data:/data
      - ${TRADERBOT_KEYS_FILE:-/dev/null}:/keys/traderbot-keys.txt:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

  engine:
    build:
      context: .
      dockerfile: packages/engine/Dockerfile
    environment:
      API_BASE_URL: http://api:8080
      INTERNAL_EVENT_TOKEN: ${INTERNAL_EVENT_TOKEN:-dev-token}
      MODE: ${MODE:-sim}
      BOTS_DIR: /bots
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET:-}
      ALPACA_PAPER: ${ALPACA_PAPER:-true}
      # Phase 1 paper-trader state (Trendia's peaks, entries, pending
      # orders, realized PnL) persists on the shared data volume so a
      # restart reconciles instead of forgetting open positions.
      PAPER_STATE_PATH: /data/paper-trendia-state.json
      # Phase 3 (Vega): SHADOW mode is the delivered default — his full
      # options pipeline runs and logs decision/order-intent events but
      # places NO broker orders. Set VEGA_SHADOW=false in .env to flip
      # him to live paper orders (Keith's word only).
      VEGA_SHADOW: ${VEGA_SHADOW:-true}
      # Vega's state (tracked contracts, realized PnL, earnings map,
      # IV history) persists on the same shared data volume.
      VEGA_STATE_PATH: /data/paper-vega-state.json
      # Phase 4 (Snapback): her state (tracked positions, pending
      # orders, realized PnL) persists on the same shared data volume.
      SNAPBACK_STATE_PATH: /data/paper-snapback-state.json
      # Phase 12 (v21): paper keys come from the local keys file
      # (mounted read-only below from TRADERBOT_KEYS_FILE in .env;
      # /dev/null = empty file until that's set). File beats env.
      KEYS_FILE: /keys/traderbot-keys.txt
      # Phase 12: Wesley's wheel state and PolyCrypt9000's sleeve
      # state persist on the shared data volume like the others.
      WESLEY_STATE_PATH: /data/paper-wesley-state.json
      POLYCRYPT_STATE_PATH: /data/paper-polycrypt-state.json
      # Phase 5: the stored dashboard mode choice (written by the API,
      # see MODE_STATE_PATH on the api service). Read at boot; when the
      # dashboard flips the switch, this engine exits and the restart
      # policy below relaunches it into the stored mode.
      MODE_STATE_PATH: /data/mode-state.json
      # v22: the Reset All Data coordinator's progress marker lives on
      # the same durable volume, so a mid-reset engine restart resumes
      # the wipe instead of double-applying it.
      RESET_PROGRESS_PATH: /data/reset-progress.json
    volumes:
      - ../bots:/bots:ro
      - fleet-data:/data
      - ${TRADERBOT_KEYS_FILE:-/dev/null}:/keys/traderbot-keys.txt:ro
    depends_on:
      - api
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        # Production public API address (API_URL in .env). Vite bakes
        # it into the static bundle at build time, so changing API_URL
        # requires `docker compose up -d --build`, not a restart.
        VITE_API_URL: ${API_URL:-}
        # Optional display override for the build version shown under
        # the "Trader Bot Landscape" header (BUILD_VERSION in .env).
        # Blank keeps the checked-in default in web/src/version.ts.
        VITE_BUILD_VERSION: ${BUILD_VERSION:-}
    ports:
      - "4173:4173"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  # API-owned persistent state (kill-switch control state today).
  fleet-data:
